name: caretaker

on:
  schedule:
    - cron: "23 22 * * *"   # 매일 07:23 KST (UTC 22:23)
    - cron: "23 10 * * *"   # 매일 19:23 KST (UTC 10:23)
  workflow_dispatch:         # Actions 탭의 수동 실행 버튼

jobs:
  wake-streamlit:
    name: 스트림릿 앱 깨우기
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Playwright 설치
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: apps.txt의 앱들 방문
        run: python wake.py apps.txt

  ping-supabase:
    name: Supabase 살려두기
    runs-on: ubuntu-latest
    steps:
      - name: REST 요청 한 번으로 사용 기록 남기기
        env:
          SUPABASE_PINGS: ${{ secrets.SUPABASE_PINGS }}
        run: |
          if [ -z "$SUPABASE_PINGS" ]; then
            echo "등록된 Supabase 프로젝트 없음 — 통과"
            exit 0
          fi
          fail=0
          while IFS='|' read -r name url key; do
            [ -z "$url" ] && continue
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url/rest/v1/" -H "apikey: $key")
            echo "$name: HTTP $code"
            [ "$code" = "200" ] || fail=1
          done <<< "$SUPABASE_PINGS"
          exit $fail
